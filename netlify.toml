# Configuración de despliegue en Netlify
# Sitio estático (HTML + Tailwind por CDN): no hay build, solo se publica la carpeta public.
[build]
  publish = "public"
  command = ""

# Analítica propia de clics en CTAs (skill cta-tracking): track + panel stats
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
